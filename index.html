<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HP AUDIENCE</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font:16px/1.45 system-ui,sans-serif;color:#20242a;background:#f5f2ed}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:640px;margin:auto}h1{font-size:25px;margin:8px 0 2px}h2{font-size:18px;margin:0 0 12px}.muted{font-size:13px;color:#6d635a}section{background:#fff;border:1px solid #e1dbd2;border-radius:14px;margin:14px 0;padding:16px}button{border:0;border-radius:10px;background:#217ec4;color:#fff;padding:13px 15px;font-weight:600;font-size:15px;width:100%;margin:7px 0;cursor:pointer}button:disabled{opacity:.55;cursor:default}button.alt{background:#fff;color:#217ec4;border:1px solid #217ec4}label{display:block;margin:12px 0 4px;font-size:14px}input,textarea{width:100%;padding:12px;border:1px solid #cfc5b8;border-radius:9px;font:inherit;background:#fff;color:#20242a}textarea{min-height:80px}#preview{display:block;max-width:100%;max-height:250px;margin:10px auto;border-radius:8px}#preview[hidden],[hidden]{display:none!important}#status,#connection{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}.err{color:#b91c1c}.ok{color:#147446}small{display:block;margin-top:4px}fieldset{border:1px solid #e1dbd2;border-radius:9px;margin:12px 0;padding:10px}legend{font-weight:600}.staffrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.staffrow label{display:flex;align-items:center;gap:8px;flex:1;margin:0;min-width:150px}.staffrow input{width:20px;height:20px;padding:0;flex-shrink:0}select{padding:8px;border:1px solid #cfc5b8;border-radius:7px;font:inherit;background:#fff;color:#20242a}.staffrow select{max-width:145px;font-size:13px}#zStatus{width:100%}</style></head><body><main>
<h1>HP AUDIENCE</h1><div class="muted">Рабочее меню · закрытие смены</div>
<section><h2>Выберите операцию</h2><p id="access" class="muted">Проверяю права сотрудника…</p><button id="expense" hidden>Внести расход</button><button id="shift" disabled>Отчёт о закрытии смены</button><button id="ping" class="alt">Проверить связь с сервером</button><div id="connection" role="status"></div></section>
<section id="form" hidden><h2>Итоги смены</h2><label for="date">Дата смены</label><input type="date" id="date"><div id="staff"></div><small class="muted">Отметьте всех работавших сотрудников. Если вид выхода неизвестен, оставьте «не указано».</small><label for="photo">Фото X-отчёта (обязательно)</label><input type="file" id="photo" accept="image/jpeg,image/png"><small class="muted">JPEG или PNG, до 5 МБ. Выберите фото, затем проверьте дату.</small><img id="preview" alt="Предпросмотр Z-отчёта" hidden><label for="zStatus">Сверка Z-отчёта</label><select id="zStatus"><option value="">Выберите результат</option><option value="match">Сходится</option><option value="mismatch">Расхождение</option><option value="unchecked">Не проверен</option></select><label for="comment">Комментарий (необязательно)</label><textarea id="comment" maxlength="250" placeholder="Итоги смены"></textarea><button id="send" disabled>Отправить итоги смены</button><div id="status" role="status"></div></section></main>
<script>
// Вставьте сюда URL НОВОГО развёртывания Apps Script (/exec).
const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwEhY4MaB31j-MMC0rS2wa7gN4pkHq-XBsu9lyRj7vKfDXZ_7A6lTk9dY-gwKyjPgQi/exec';
const EXPENSE_APP_URL = 'https://natalia93-coder.github.io/HP_AUDIENCE_expenses_app/';
const tg = window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);let selected=null, canShift=false, sending=false, rosterReady=false;
// Учетная дата по московскому времени, до 06:00 — предыдущий день (как в исходном Audience, с явной зоной).
const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));const nowDate=new Date(Date.UTC(+parts.year,+parts.month-1,+parts.day));if(+parts.hour<6)nowDate.setUTCDate(nowDate.getUTCDate()-1);$('date').value=nowDate.toISOString().slice(0,10);
function show(el,msg,cls=''){el.textContent=msg;el.className=cls;}
async function request(body){if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_WEBAPP_URL))throw Error('В index.html не указан URL нового развёртывания /exec.');const r=await fetch(GAS_WEBAPP_URL,{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw Error('HTTP '+r.status+' при обращении к серверу.');const raw=await r.text();try{return JSON.parse(raw)}catch(e){throw Error('Сервер вернул не JSON. Проверьте доступ и адрес развёртывания.');}}
$('ping').onclick=async()=>{const b=$('ping');b.disabled=true;show($('connection'),'Проверяю POST…');try{const r=await request({action:'ping'});if(!r.ok)throw Error(r.error||'Нет ответа');show($('connection'),'POST работает · '+r.build,'ok');}catch(e){show($('connection'),'Связь: '+e.message,'err');}finally{b.disabled=false;}};
function readStaff(){return [...$('staff').querySelectorAll('input:checked')].map(x=>({id:x.value,type:x.closest('.staffrow').querySelector('select').value}));}
function updateSend(){const roster=readStaff();$('send').disabled=!(canShift&&rosterReady&&selected&&!sending&&$('date').value&&$('zStatus').value&&roster.some(x=>$('staff').querySelector('input[value="'+x.id+'"]').dataset.role==='Админ')&&($('zStatus').value!=='mismatch'||$('comment').value.trim()));}
function renderStaff(roster){const root=$('staff');root.replaceChildren();for(const role of ['Админ','Бар','КМ','Хостес']){const entries=roster.filter(x=>x.role===role);if(!entries.length)continue;const fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=role;fs.append(legend);for(const person of entries){const row=document.createElement('div');row.className='staffrow';const lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.value=person.id;cb.dataset.role=role;const name=document.createElement('span');name.textContent=person.name;lab.append(cb,name);const sel=document.createElement('select');sel.setAttribute('aria-label','Вид выхода: '+person.name);for(const t of ['не указано','день','вечер','помощь','смена']){const op=document.createElement('option');op.value=t;op.textContent=t;sel.append(op);}sel.hidden=true;cb.onchange=()=>{sel.hidden=!cb.checked;updateSend();};sel.onchange=updateSend;row.append(lab,sel);fs.append(row);}root.append(fs);}rosterReady=roster.some(x=>x.role==='Админ');updateSend();}
for(const id of ['date','zStatus','comment'])$(id).addEventListener('input',updateSend);
async function checkAccess(){if(!tg?.initData){show($('access'),'Откройте приложение через Telegram Mini App.','err');return;}try{const r=await request({action:'check_access',initData:tg.initData});if(!r.ok)throw Error(r.error||'Права не подтверждены');canShift=!!r.canShift;$('expense').hidden=!r.canExpense;if(canShift&&Array.isArray(r.roster))renderStaff(r.roster);$('shift').disabled=!canShift||!rosterReady;if(canShift&&!rosterReady){show($('access'),r.rosterError||'Справочник недоступен. Обновите сервер до версии 1.3.','err');return;}show($('access'),canShift||r.canExpense?'Права подтверждены.':'У вас нет доступа к операциям.',canShift||r.canExpense?'ok':'err');}catch(e){show($('access'),'Проверка доступа: '+e.message,'err');}}
$('shift').onclick=()=>{$('form').hidden=false;$('form').scrollIntoView({behavior:'smooth'});};$('expense').onclick=()=>{location.href=EXPENSE_APP_URL;};
$('photo').onchange=async()=>{const file=$('photo').files[0];selected=null;$('send').disabled=true;$('preview').hidden=true;if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)||file.size>5*1024*1024){show($('status'),'Нужно фото JPEG или PNG до 5 МБ.','err');return;}const reader=new FileReader();reader.onload=()=>{const url=String(reader.result);selected={photoBase64:url.split(',')[1],photoMimeType:file.type};$('preview').src=url;$('preview').hidden=false;updateSend();show($('status'),'Фото прикреплено.','ok');};reader.onerror=()=>show($('status'),'Не удалось прочитать фото.','err');reader.readAsDataURL(file);};
$('send').onclick=async()=>{if(sending||$('send').disabled)return;sending=true;$('send').disabled=true;show($('status'),'Получаю данные из iiko и отправляю в Telegram…');try{const r=await request({action:'close_shift',initData:tg.initData,shiftDate:$('date').value,comment:$('comment').value.trim(),staff:readStaff(),zStatus:$('zStatus').value,...selected});if(!r.ok)throw Error((r.stage?'['+r.stage+'] ':'')+(r.error||'Ошибка сервера'));show($('status'),r.message||'Отчёт отправлен.','ok');return;}catch(e){show($('status'),e.message+'\nЕсли отчёт уже появился в чате, не отправляйте повторно.','err');sending=false;updateSend();}};
checkAccess();
</script></body></html>
